<!DOCTYPE html>
<html>
<head>
  <title>Lil' Chat</title>

  <!-- Google Font: Oswald -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Oswald', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: 250px;
      background: #1e1e1e;
      padding: 20px;
      border-right: 3px solid #2a2a2a;
      display: none;
      flex-direction: column;
    }

    #sidebar h2 {
      color: #ACF034;
      margin-bottom: 10px;
    }

    .contact {
      position: relative;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px 0;
    }

    .contact:hover {
      background: #3a3a3a;
    }

    .statusDot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
      right: 6px;
      background-color: gray;
      border: 2px solid #1e1e1e;
    }

    /* MAIN CHAT AREA */
    #main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: none;
    }

    h1 {
      text-align: center;
      color: #ACF034;
      font-weight: 500;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      font-family: 'Oswald', sans-serif;
    }

    input {
      background: #2a2a2a;
      color: white;
    }

    button {
      background: #ACF034;
      color: black;
      cursor: pointer;
      font-weight: 600;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .msg {
      background: #3a3a3a;
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
    }

    /* AUTH BOX */
    #authBox {
      width: 400px;
      margin: auto;
      margin-top: 100px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <h2>Contacts</h2>
  <button onclick="showAddContact()">Add Contact</button>

  <div id="addContactBox" style="display:none;">
    <input id="addContactInput" placeholder="Enter username">
    <button onclick="addContact()">Add</button>
    <p id="addContactMsg"></p>
  </div>

  <div id="contacts"></div>
</div>

<!-- MAIN CHAT AREA -->
<div id="main">
  <h1 id="welcome"></h1>

  <h3>Chat</h3>
  <div id="chatBox"></div>

  <input id="msgInput" placeholder="Type a message">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- AUTH BOX -->
<div id="authBox">
  <h2>Create Account</h2>
  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>

  <h2>Login</h2>
  <input id="loginUser" placeholder="Username">
  <input id="loginPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>

  <p id="authMsg"></p>
</div>

<script>
  let currentUser = null;
  let currentChatPartner = null;

  function getUsers() {
    return JSON.parse(localStorage.getItem("users") || "{}");
  }

  function saveUsers(users) {
    localStorage.setItem("users", JSON.stringify(users));
  }

  // SIGN UP
  function signup() {
    let user = document.getElementById("newUser").value.trim();
    let pass = document.getElementById("newPass").value;

    let users = getUsers();

    if (!user || !pass) {
      document.getElementById("authMsg").innerText = "Enter username and password";
      return;
    }

    if (users[user]) {
      document.getElementById("authMsg").innerText = "Username already taken";
      return;
    }

    users[user] = { password: pass, online: false, contacts: [] };
    saveUsers(users);

    document.getElementById("authMsg").innerText = "Account created";
  }

  // LOGIN
  function login() {
    let user = document.getElementById("loginUser").value.trim();
    let pass = document.getElementById("loginPass").value;

    let users = getUsers();

    if (!users[user] || users[user].password !== pass) {
      document.getElementById("authMsg").innerText = "Wrong username or password";
      return;
    }

    currentUser = user;

    users[user].online = true;
    saveUsers(users);

    document.getElementById("authBox").style.display = "none";
    document.getElementById("sidebar").style.display = "flex";
    document.getElementById("main").style.display = "block";

    document.getElementById("welcome").innerText = "Welcome, " + currentUser;

    loadContacts();
  }

  // SHOW ADD CONTACT BOX
  function showAddContact() {
    document.getElementById("addContactBox").style.display = "block";
    document.getElementById("addContactMsg").innerText = "";
  }

  // ADD CONTACT
  function addContact() {
    let username = document.getElementById("addContactInput").value.trim();
    let users = getUsers();

    if (!username) {
      document.getElementById("addContactMsg").innerText = "Enter a username";
      return;
    }

    if (!users[username]) {
      document.getElementById("addContactMsg").innerText = "User does not exist";
      return;
    }

    if (username === currentUser) {
      document.getElementById("addContactMsg").innerText = "You cannot add yourself";
      return;
    }

    if (!users[currentUser].contacts.includes(username)) {
      users[currentUser].contacts.push(username);
      saveUsers(users);
      loadContacts();
      document.getElementById("addContactMsg").innerText = "Contact added";
    } else {
      document.getElementById("addContactMsg").innerText = "Already in contacts";
    }
  }

  // LOAD CONTACTS INTO SIDEBAR
  function loadContacts() {
    let users = getUsers();
    let contactsDiv = document.getElementById("contacts");
    contactsDiv.innerHTML = "";

    let contacts = users[currentUser].contacts || [];

    contacts.forEach(u => {
      let online = users[u] && users[u].online ? "#ACF034" : "gray";

      contactsDiv.innerHTML += `
        <div class="contact" onclick="openChat('${u}')">
          ${u}
          <div class="statusDot" style="background:${online};"></div>
        </div>
      `;
    });
  }

  // OPEN CHAT
  function openChat(friend) {
    currentChatPartner = friend;
    loadMessages();
  }

  // LOAD MESSAGES
  function loadMessages() {
    let chatID = getChatID(currentUser, currentChatPartner);
    let messages = JSON.parse(localStorage.getItem(chatID) || "[]");

    let chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";

    messages.forEach(m => {
      chatBox.innerHTML += `<div class="msg"><b>${m.sender}:</b> ${m.text}</div>`;
    });

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // CHAT ID
  function getChatID(a, b) {
    return "chat_" + [a, b].sort().join("_");
  }

  // SEND MESSAGE
  function sendMessage() {
    if (!currentChatPartner) return;

    let text = document.getElementById("msgInput").value;
    if (text.trim() === "") return;

    let chatID = getChatID(currentUser, currentChatPartner);
    let messages = JSON.parse(localStorage.getItem(chatID) || "[]");

    messages.push({ sender: currentUser, text: text });
    localStorage.setItem(chatID, JSON.stringify(messages));

    document.getElementById("msgInput").value = "";
    loadMessages();
  }

  // SET USER OFFLINE WHEN LEAVING
  window.addEventListener("beforeunload", () => {
    let users = getUsers();
    if (currentUser && users[currentUser]) {
      users[currentUser].online = false;
      saveUsers(users);
    }
  });
</script>

</body>
</html>
