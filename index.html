<!DOCTYPE html>
<html>
<head>
    <title>Lil' Chat</title>
    <!-- Google Font: Oswald -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Oswald', sans-serif; margin: 0; padding: 0; }
        h1 { text-align: center; padding: 20px; color: #ACF034; font-weight: 500; }
        .container { width: 90%; max-width: 500px; margin: auto; margin-top: 30px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #000; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 16px; font-family: 'Oswald', sans-serif; }
        input { background: #2a2a2a; color: white; }
        button { background: #ACF034; color: black; cursor: pointer; font-weight: 600; }
        .contact { position: relative; background: #2a2a2a; padding: 10px; border-radius: 6px; cursor: pointer; margin: 5px 0; }
        .contact:hover { background: #3a3a3a; }
        .statusDot { width: 12px; height: 12px; border-radius: 50%; position: absolute; bottom: 6px; right: 6px; background-color: gray; border: 2px solid #1e1e1e; }
        #chatBox { height: 250px; overflow-y: auto; background: #2a2a2a; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .msg { background: #3a3a3a; padding: 8px; margin: 5px 0; border-radius: 6px; }
        #addContactBox { display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Lil' Chat</h1>

    <!-- AUTH BOX -->
    <div class="container" id="authBox">
        <h2>Create Account</h2>
        <input id="newUser" placeholder="Username">
        <input id="newPass" type="password" placeholder="Password">
        <button onclick="signup()">Sign Up</button>
        <h2>Login</h2>
        <input id="loginUser" placeholder="Username">
        <input id="loginPass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="authMsg"></p>
    </div>

    <!-- CHAT UI -->
    <div class="container" id="chatUI" style="display:none;">
        <h2 id="welcome"></h2>
        <h3>Your Contacts</h3>
        <button onclick="showAddContact()">Add Contact</button>
        <div id="addContactBox">
            <input id="addContactInput" placeholder="Enter username">
            <button onclick="addContact()">Add</button>
            <p id="addContactMsg"></p>
        </div>
        <div id="contacts"></div>

        <h3>Chat</h3>
        <div id="chatBox"></div>
        <input id="msgInput" placeholder="Type a message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let currentUser = null;
        let currentChatPartner = null;
        let refreshInterval = null;

        function getUsers() { return JSON.parse(localStorage.getItem("users") || "{}"); }
        function saveUsers(users) { localStorage.setItem("users", JSON.stringify(users)); }

        function signup() {
            let user = document.getElementById("newUser").value.trim();
            let pass = document.getElementById("newPass").value;
            let users = getUsers();
            if (!user || !pass) { document.getElementById("authMsg").innerText = "Enter username and password"; return; }
            if (users[user]) { document.getElementById("authMsg").innerText = "Username already taken"; return; }
            users[user] = { password: pass, online: false, contacts: [] };
            saveUsers(users);
            document.getElementById("authMsg").innerText = "Account created";
        }

        function login() {
            let user = document.getElementById("loginUser").value.trim();
            let pass = document.getElementById("loginPass").value;
            let users = getUsers();
            if (!users[user] || users[user].password !== pass) { document.getElementById("authMsg").innerText = "Wrong username or password"; return; }
            currentUser = user;
            users[user].online = true;
            saveUsers(users);
            document.getElementById("authBox").style.display = "none";
            document.getElementById("chatUI").style.display = "block";
            document.getElementById("welcome").innerText = "Welcome, " + currentUser;
            loadContacts();
        }

        function showAddContact() {
            document.getElementById("addContactBox").style.display = "block";
            document.getElementById("addContactMsg").innerText = "";
        }

        function addContact() {
            let username = document.getElementById("addContactInput").value.trim();
            let users = getUsers();
            if (!username) { document.getElementById("addContactMsg").innerText = "Enter a username"; return; }
            if (!users[username]) { document.getElementById("addContactMsg").innerText = "User does not exist"; return; }
            if (username === currentUser) { document.getElementById("addContactMsg").innerText = "You cannot add yourself"; return; }
            if (!users[currentUser].contacts.includes(username)) {
                users[currentUser].contacts.push(username);
                saveUsers(users);
                loadContacts();
                document.getElementById("addContactMsg").innerText = "Contact added";
            } else {
                document.getElementById("addContactMsg").innerText = "Already in contacts";
            }
        }

        function loadContacts() {
            let users = getUsers();
            let contactsDiv = document.getElementById("contacts");
            contactsDiv.innerHTML = "";
            let contacts = users[currentUser].contacts || [];
            contacts.forEach(u => {
                let online = users[u] && users[u].online ? "#ACF034" : "gray";
                contactsDiv.innerHTML += `
                    <div class="contact" onclick="openChat('${u}')">
                        ${u}
                        <div class="statusDot" style="background:${online};"></div>
                    </div>
                `;
            });
        }

        function openChat(friend) {
            currentChatPartner = friend;
            loadMessages();
            // Start the auto-refresh timer
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(loadMessages, 2000);
        }

        function loadMessages() {
            if (!currentChatPartner) return;
            let chatID = getChatID(currentUser, currentChatPartner);
            let messages = JSON.parse(localStorage.getItem(chatID) || "[]");
            let chatBox = document.getElementById("chatBox");
            
            // Stay at bottom only if the user is already scrolled down
            let isAtBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;

            let html = "";
            messages.forEach(m => {
                html += `<div class="msg"><b>${m.sender}:</b> ${m.text}</div>`;
            });
            chatBox.innerHTML = html;

            if (isAtBottom) {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function getChatID(a, b) { return "chat_" + [a, b].sort().join("_"); }

        function sendMessage() {
            if (!currentChatPartner) return;
            let text = document.getElementById("msgInput").value;
            if (text.trim() === "") return;
            let chatID = getChatID(currentUser, currentChatPartner);
            let messages = JSON.parse(localStorage.getItem(chatID) || "[]");
            messages.push({ sender: currentUser, text: text });
            localStorage.setItem(chatID, JSON.stringify(messages));
            document.getElementById("msgInput").value = "";
            loadMessages();
        }

        // Send message with Enter key
        document.getElementById("msgInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        window.addEventListener("beforeunload", () => {
            let users = getUsers();
            if (currentUser && users[currentUser]) {
                users[currentUser].online = false;
                saveUsers(users);
            }
        });
    </script>
</body>
</html>
